<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --ink:#16213A; --muted:#5B6778; --line:#D6DCE4;
  --navy:#16213A; --red:#C8102E; --red-soft:#FBE7EA;
  --spv:#1F5FAE; --spv-soft:#E4EEFA; --int:#9A6A00; --int-soft:#FBF0D6;
  --call:#1E7A46; --call-soft:#E2F3E9; --star:#E0A400;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1422; --surface:#172035; --ink:#E8ECF3; --muted:#9AA6B8; --line:#2A3550;
    --red-soft:#3A1720; --spv-soft:#15294A; --int-soft:#3A2E10; --call-soft:#123223;
    --spv:#7FB0F0; --int:#E6B64A; --call:#5CCB8C;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1422; --surface:#172035; --ink:#E8ECF3; --muted:#9AA6B8; --line:#2A3550;
  --red-soft:#3A1720; --spv-soft:#15294A; --int-soft:#3A2E10; --call-soft:#123223;
  --spv:#7FB0F0; --int:#E6B64A; --call:#5CCB8C;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:14px 16px 12px;border-bottom:4px solid var(--red)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;max-width:760px;margin:0 auto}
h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:1.9rem;line-height:1;margin:0;letter-spacing:.01em}
h1 small{display:block;font-family:"Barlow",sans-serif;font-weight:500;font-size:.8rem;opacity:.75;margin-top:4px;letter-spacing:0}
.count{font-family:"Barlow Condensed",sans-serif;font-size:1.05rem;opacity:.85;white-space:nowrap}
.search{max-width:760px;margin:12px auto 0;position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:11px 40px 11px 14px;border-radius:10px;border:0;background:#fff;color:#16213A}
.search input:focus{outline:3px solid var(--red);outline-offset:1px}
.clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:1.4rem;color:#5B6778;padding:4px 8px;cursor:pointer;display:none}
.chips{max-width:760px;margin:10px auto 0;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;font:inherit;font-weight:600;font-size:.9rem;padding:6px 12px;border-radius:999px;border:1.5px solid rgba(255,255,255,.35);background:transparent;color:#fff;cursor:pointer}
.chip[aria-pressed="true"]{background:#fff;color:var(--navy);border-color:#fff}
main{max-width:760px;margin:0 auto;padding:4px 40px 40px 12px;position:relative}
.letter{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.35rem;color:var(--red);margin:18px 4px 6px;scroll-margin-top:170px}
.agent{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 10px 10px 14px;margin-bottom:8px}
.row{display:flex;align-items:center;gap:8px}
.name{flex:1;min-width:0;font-family:"Barlow Condensed",sans-serif;font-size:1.3rem;line-height:1.15}
.name b{font-weight:700}
.name span{font-weight:600;color:var(--muted)}
.badge{font-weight:600;font-size:.75rem;padding:2px 8px;border-radius:6px;white-space:nowrap}
.b-P{background:var(--red-soft);color:var(--red)}
.b-V{background:var(--spv-soft);color:var(--spv)}
.b-I{background:var(--int-soft);color:var(--int)}
.fav{border:0;background:none;font-size:1.35rem;line-height:1;color:var(--line);cursor:pointer;padding:4px}
.fav[aria-pressed="true"]{color:var(--star)}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.num{display:flex;align-items:stretch;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.num a{display:flex;align-items:center;gap:6px;text-decoration:none;font-weight:600;font-variant-numeric:tabular-nums;padding:7px 10px;color:var(--call);background:var(--call-soft)}
.num a.sms{background:transparent;color:var(--muted);border-left:1px solid var(--line);padding:7px 9px}
.num svg{width:16px;height:16px;flex:0 0 auto}
.kind{font-weight:500;font-size:.75rem;color:var(--muted)}
.me{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.rail{position:fixed;right:max(4px, calc(50% - 380px + 4px));top:180px;bottom:16px;display:flex;flex-direction:column;justify-content:space-between;z-index:4}
.rail button{border:0;background:none;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.8rem;color:var(--muted);padding:0 6px;cursor:pointer;line-height:1}
.rail button:focus-visible,.fav:focus-visible,.num a:focus-visible,.chip:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.empty{text-align:center;color:var(--muted);padding:40px 16px}
footer{text-align:center;color:var(--muted);font-size:.85rem;padding:8px 16px 28px}

#gate{position:fixed;inset:0;z-index:20;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:24px}
.gate-box{width:100%;max-width:360px;text-align:left}
.gate-mark{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.1rem;letter-spacing:.18em;color:#fff;background:var(--red);display:inline-block;padding:3px 10px;border-radius:4px;margin-bottom:16px}
.gate-box h1{font-family:"Barlow Condensed",sans-serif;font-size:2rem;line-height:1.05;margin:0 0 10px}
.gate-box p{color:rgba(255,255,255,.78);font-size:.95rem;margin:0 0 20px}
.gate-box label{display:block;font-size:.85rem;font-weight:600;color:rgba(255,255,255,.78);margin-bottom:6px}
.gate-box input{width:100%;font:inherit;font-size:1.15rem;letter-spacing:.12em;padding:12px 14px;border:0;border-radius:10px;background:#fff;color:#16213A}
.gate-box input:focus{outline:3px solid var(--red);outline-offset:1px}
#gate-go{width:100%;margin-top:12px;font:inherit;font-weight:600;font-size:1.05rem;padding:13px;border:0;border-radius:10px;background:var(--red);color:#fff;cursor:pointer}
#gate-go:active{transform:translateY(1px)}
.gate-box .err{color:#FFB3BE;font-size:.9rem;min-height:1.2em;margin:10px 0 0}
.gate-box .note{font-size:.8rem;color:rgba(255,255,255,.55);margin:14px 0 0}
@media (max-height:560px){.rail{display:none}main{padding-right:12px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>

    <label for="code">Code d’accès</label>
    <input id="code" type="password" autocomplete="off" autocapitalize="characters" spellcheck="false" inputmode="text">
    <button id="gate-go">Ouvrir l’annuaire</button>
    <p class="err" id="gate-err" role="alert"></p>

  </div>
</section>

let RAW = "";

const LABEL = {P:"SPP", V:"SPV", I:"I"};
const fold = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const fmt = n => n.replace(/(\d{2})(?=\d)/g,"$1 ");
const isMobile = n => /^0[67]/.test(n);

let agents = [];
function buildAgents(txt){
  agents = txt.trim().split("\n").map(l => {
    const [nom, prenom, statut, nums] = l.split("|");
    const numbers = nums.split(",");
    return {id: fold(nom+"-"+prenom).replace(/\s+/g,"-"), nom, prenom, statut, numbers,
            key: fold(nom+" "+prenom+" "+prenom+" "+nom)};
  }).sort((a,b) => fold(a.nom+a.prenom).localeCompare(fold(b.nom+b.prenom)));
}

let favs = new Set();
try { favs = new Set(JSON.parse(localStorage.getItem("vienne-favs") || "[]")); } catch(e) {}
const saveFavs = () => { try { localStorage.setItem("vienne-favs", JSON.stringify([...favs])); } catch(e) {} };

let filter = "all", query = "";
const $list = document.getElementById("list"), $q = document.getElementById("q"),
      $clear = document.getElementById("clear"), $count = document.getElementById("count"),
      $rail = document.getElementById("rail");

const phoneIcon = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.57a1 1 0 0 1-.25 1z"/></svg>';
const smsIcon = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" stroke-linejoin="round"/></svg>';

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const q = fold(query.trim()), qd = query.replace(/\D/g,"");
  const shown = agents.filter(a => {
    if (filter === "fav" && !favs.has(a.id)) return false;
    if (["P","V","I"].includes(filter) && a.statut !== filter) return false;
    if (!q) return true;
    if (qd.length >= 2 && a.numbers.some(n => n.includes(qd))) return true;
    return q.split(/\s+/).every(w => a.key.includes(w));
  });
  $count.textContent = shown.length + (shown.length > 1 ? " agents" : " agent");
  $clear.style.display = query ? "block" : "none";

  if (!shown.length){
    $list.innerHTML = filter === "fav" && !q
      ? '<p class="empty">Touchez l’étoile d’un agent pour l’ajouter à vos favoris.</p>'
      : '<p class="empty">Aucun agent ne correspond. Vérifiez l’orthographe ou changez de filtre.</p>';
    $rail.innerHTML = ""; return;
  }
  let html = "", last = "", letters = [];
  for (const a of shown){
    const L = fold(a.nom[0]).toUpperCase();
    if (L !== last){ html += `<h2 class="letter" id="l-${L}">${L}</h2>`; letters.push(L); last = L; }
    const nums = a.numbers.map(n => `
      <div class="num">
        <a href="tel:${n}" aria-label="Appeler ${esc(a.prenom)} ${esc(a.nom)} au ${fmt(n)}">${phoneIcon}${fmt(n)}<span class="kind">${isMobile(n) ? "" : "fixe"}</span></a>
        ${isMobile(n) ? `<a class="sms" href="sms:${n}" aria-label="Envoyer un SMS au ${fmt(n)}">${smsIcon}</a>` : ""}
      </div>`).join("");
    const isMe = a.id === "mauries-pierre";
    html += `<article class="agent${isMe ? " me" : ""}">
      <div class="row">
        <div class="name"><b>${esc(a.nom)}</b> <span>${esc(a.prenom)}</span></div>
        <span class="badge b-${a.statut}">${LABEL[a.statut]}</span>
        <button class="fav" data-id="${a.id}" aria-pressed="${favs.has(a.id)}" aria-label="Favori">★</button>
      </div>
      <div class="nums">${nums}</div>
    </article>`;
  }
  $list.innerHTML = html;
  $rail.innerHTML = letters.map(L => `<button data-l="${L}">${L}</button>`).join("");
}

$q.addEventListener("input", e => { query = e.target.value; render(); });
$clear.addEventListener("click", () => { query = ""; $q.value = ""; $q.focus(); render(); });
document.querySelectorAll(".chip").forEach(c => c.addEventListener("click", () => {
  filter = c.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.setAttribute("aria-pressed", x === c));
  render(); window.scrollTo(0,0);
}));
$list.addEventListener("click", e => {
  const b = e.target.closest(".fav"); if (!b) return;
  const id = b.dataset.id;
  favs.has(id) ? favs.delete(id) : favs.add(id);
  saveFavs();
  if (filter === "fav") render(); else b.setAttribute("aria-pressed", favs.has(id));
});
$rail.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.getElementById("l-" + b.dataset.l)?.scrollIntoView({block:"start"});
});

/* --- Code d'accès : les données sont chiffrées (AES-GCM) dans la page --- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const $gate = document.getElementById("gate"), $code = document.getElementById("code"),
      $err = document.getElementById("gate-err"), $app = document.getElementById("app");

async function unlock(code){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(BLOB.s), iterations:300000, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.i)}, key, b64(BLOB.d));
  return new TextDecoder().decode(plain);
}

async function tryCode(code, silent){
  try {
    const txt = await unlock(code);
    buildAgents(txt);
    render();
    $gate.remove();
    $app.hidden = false;
    try { localStorage.setItem("vienne-code", code); } catch(e) {}
    return true;
  } catch(e) {
    if (!silent) $err.textContent = "Code incorrect. Demandez-le à un collègue du centre.";
    return false;
  }
}

document.getElementById("gate-go").addEventListener("click", () => tryCode($code.value.trim()));
$code.addEventListener("keydown", e => { if (e.key === "Enter") tryCode($code.value.trim()); });
$code.addEventListener("input", () => { $err.textContent = ""; });

(async () => {
  let saved = null;
  try { saved = localStorage.getItem("vienne-code"); } catch(e) {}
  if (!saved || !(await tryCode(saved, true))) $code.focus();
})();
</script>
